[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "resilient-water-ai"
version = "0.1.0"
description = "Synthetic multi-scenario water preparedness network design"
requires-python = ">=3.12"
dependencies = ["scipy>=1.12,<2", "pandas>=2,<4", "streamlit>=1.40,<2", "plotly>=5,<8"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
